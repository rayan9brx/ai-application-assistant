@let h = hurdle();
<article class="step" [id]="h.id" [attr.aria-labelledby]="h.id + '-title'">
  <div class="text">
    <span class="ghost" aria-hidden="true">{{ h.number }}</span>
    <p class="label">{{ h.label }}</p>
    <h3 [id]="h.id + '-title'">{{ h.title }}</h3>
    <p class="pain">{{ h.pain }}</p>
    <p class="help-title" [id]="h.id + '-help'">How we help</p>
    <ul class="benefits" role="list" [attr.aria-labelledby]="h.id + '-help'">
      @for (benefit of h.benefits; track benefit) {
        <li>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" /></svg>
          {{ benefit }}
        </li>
      }
    </ul>
    <a class="step-cta" [href]="h.cta.href">{{ h.cta.label }} <span aria-hidden="true">→</span></a>
  </div>

  <div class="visual">
    @switch (h.visual) {
      @case ('jobs') {
        <app-job-match-mock [play]="visible()" />
      }
      @case ('rewrite') {
        <app-bullet-rewrite-mock [play]="visible()" [animate]="animate()" />
      }
      @case ('ats') {
        <app-ats-score-mock [play]="visible()" [animate]="animate()" />
      }
    }
  </div>
</article>
