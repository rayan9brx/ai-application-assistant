<div
  class="upload-bar"
  [class.dragging]="dragging()"
  [class.invalid]="!!error()"
  (dragenter)="dragOver($event)"
  (dragover)="dragOver($event)"
  (dragleave)="dragLeave($event)"
  (drop)="drop($event)"
>
  <span class="thumb" aria-hidden="true">
    <svg class="page" viewBox="0 0 28 36">
      <rect x=".5" y=".5" width="27" height="35" rx="4" />
      <path d="M6 8h10M6 13h16M6 17h16M6 21h12M6 25h14" />
    </svg>
    <span class="ring">
      <svg viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15" />
        <circle class="ring-value" cx="18" cy="18" r="15" pathLength="100" />
      </svg>
      <span>95</span>
    </span>
  </span>
  <div class="copy">
    @if (file(); as f) {
      <p class="file">
        <span class="file-name" [title]="f.name">{{ f.name }}</span>
        <button
          class="remove"
          type="button"
          [attr.aria-label]="'Remove ' + f.name"
          [disabled]="busy()"
          (click)="remove()"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </p>
      <p class="status" id="upload-bar-status" aria-live="polite">
        Ready to score ·
        <button class="browse small" type="button" [disabled]="busy()" (click)="browse()">
          Choose another
        </button>
      </p>
    } @else {
      <p>
        <button class="browse" type="button" aria-describedby="upload-bar-status" (click)="browse()">
          Upload</button
        >&nbsp;or drop your CV to get your free score
      </p>
      <p class="status" id="upload-bar-status" aria-live="polite">
        {{ dragging() ? 'Drop it here' : 'PDF or Word (.docx), up to 5 MB' }}
      </p>
    }
  </div>
  <input
    #picker
    class="sr-only"
    type="file"
    [accept]="accept"
    tabindex="-1"
    aria-hidden="true"
    (change)="pick(picker)"
  />
  @if (showSubmit()) {
    <button
      class="cta score"
      type="button"
      [class.busy]="busy()"
      [attr.aria-busy]="busy()"
      (click)="submit()"
    >
      @if (busy()) {
        <span class="spinner" aria-hidden="true"></span> Scoring…
      } @else {
        Score my CV
      }
    </button>
  }
</div>
@if (error()) {
  <p class="upload-error" role="alert">{{ error() }}</p>
}
