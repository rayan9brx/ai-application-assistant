<div class="app-shell">
  <a class="skip-link" href="#main">Skip to main content</a>
  <app-navbar [links]="navLinks" />

  <main class="workspace" id="main" tabindex="-1">
    @let p = page();
    @if (p.kind === 'pricing') {
      <app-pricing-page />
    } @else if (p.kind === 'tools') {
      <app-tools-page />
    } @else if (p.kind === 'coming-soon') {
      <app-coming-soon [item]="p.item" />
    } @else {
      <app-hero />
      <app-upload-bar id="get-started" />
      <app-showcase />
      <app-problem-section />
    }
  </main>
</div>
