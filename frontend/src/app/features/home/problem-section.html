<section id="problem" aria-labelledby="problem-heading">
  <app-section-head pill="Why it matters" title="Most CVs are filtered out before a human reads them" headingId="problem-heading">
    <p>
      Most companies let an Applicant Tracking System (ATS) read your CV first. Missing keywords or a
      layout it can’t parse, and you’re out, without any feedback.
    </p>
  </app-section-head>
  <div class="panel-wrap">
    <app-ats-panel [result]="result" [cv]="cv" />
  </div>
</section>
