<section class="hero" aria-labelledby="page-title">
  <h1 id="page-title">Your CV, ready for every job.</h1>
  <p class="lede">
    Rezumo checks your CV like an ATS does, shows you exactly what’s missing, and fixes it with AI,
    in minutes.
  </p>
  <!-- Guests sign up first; the prompt and file wait in memory (not across a reload). -->
  <app-smart-prompt id="get-started" class="prompt" />
  <ul class="trust" role="list">
    @for (item of trust; track item) {
      <li><svg appCheckIcon></svg>{{ item }}</li>
    }
  </ul>
</section>
