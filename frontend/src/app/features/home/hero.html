<section class="hero" aria-labelledby="page-title">
  <h1 id="page-title">Paste a job ad. Get a CV made for it.</h1>
  <p class="lede">
    Rezumo tailors your CV to every job in one minute, shows your match score, and keeps everything
    ATS-friendly.
  </p>
  <!-- A pasted job ad or link goes to /tailor; guests sign up first (the prompt waits in memory). -->
  <app-smart-prompt id="get-started" class="prompt" />
  <a class="secondary" [href]="checkHref()">Or check your CV for free <span aria-hidden="true">→</span></a>
  <ul class="trust" role="list">
    @for (item of trust; track item) {
      <li><svg appCheckIcon></svg>{{ item }}</li>
    }
  </ul>
</section>
