<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApplyCraft — Your application workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Land more interviews with an AI-powered CV. Get your ATS score, fix weak points with AI and tailor your CV to every job.">
  <meta name="theme-color" content="#5B4FD6">

  <!-- Icons: generated from public/brand/ by frontend/scripts/generate-brand-assets.ps1 -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Link previews on X, LinkedIn and others. -->
  <!-- TODO(domain): X and LinkedIn need absolute URLs; once the site has its domain, change
       og:image / twitter:image to https://<domain>/og-image.png and add og:url. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ApplyCraft">
  <meta property="og:title" content="ApplyCraft — Land more interviews with an AI-powered CV">
  <meta property="og:description" content="Get your ATS score, fix weak points with AI and tailor your CV to every job.">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ApplyCraft logo and the tagline: Land more interviews with an AI-powered CV">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ApplyCraft — Land more interviews with an AI-powered CV">
  <meta name="twitter:description" content="Get your ATS score, fix weak points with AI and tailor your CV to every job.">
  <meta name="twitter:image" content="/og-image.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
