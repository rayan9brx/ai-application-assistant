# Tests use an in-memory H2 database instead of Supabase. Flyway's migration is
# PostgreSQL-specific (auth.users, jsonb, RLS), so Hibernate creates the schema here.
spring.datasource.url=jdbc:h2:mem:rezumo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# Never contacted in tests: tokens are injected with spring-security-test.
app.supabase.url=http://127.0.0.1:9
app.supabase.secret-key=test-secret
