# Tests are isolated from local account data; optional overrides exercise real PostgreSQL.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:accounts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
server.servlet.session.cookie.secure=false
