spring.application.name=backend
# Listen on loopback only by default (local dev, and prod behind a reverse proxy on the same host).
# Set here rather than per profile: SPRING_PROFILES_ACTIVE inside backend/.env is not applied.
server.address=127.0.0.1

# Secrets come from environment variables. For local development they can also live in
# backend/.env (KEY=value lines, never committed); see .env.example for the names.
spring.config.import=optional:file:.env[.properties]

# Only signed-in users can use the API. Accounts, saved CVs and their scores live in the
# Supabase Postgres database, reached directly over JDBC through the Session pooler.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# The Session pooler allows few connections per project; keep the pool small.
spring.datasource.hikari.maximum-pool-size=5
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Supabase pre-creates objects in "public" (e.g. the rls_auto_enable function), so the schema is
# never empty. Baseline at version 0 so V1 and later migrations still run on a fresh project.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Supabase Auth issues the access tokens; the backend verifies them against the project's JWKS.
app.supabase.url=${SUPABASE_URL}
# Server-side only: used to delete the Supabase auth user when someone deletes their account.
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Keep accepted uploads in memory and reserve space for multipart headers.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
# Parser diagnostics can contain document data; return safe application errors instead.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false

# Trust X-Forwarded-For only from the local reverse proxy, so rate limits see the client IP.
server.forward-headers-strategy=native
# Claude settings; the key itself comes from the ANTHROPIC_API_KEY environment variable.
app.ai.model=claude-opus-5-5
app.ai.effort=medium
app.ai.timeout-seconds=120
app.rate-limit.ai-per-10-min=20
app.rate-limit.files-per-10-min=60
app.rate-limit.data-per-10-min=300
