spring.application.name=backend

# Keep accepted uploads in memory and reserve space for multipart headers.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
# Parser diagnostics can contain document data; return safe application errors instead.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
