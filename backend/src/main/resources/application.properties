spring.application.name=backend

# Keep accepted uploads in memory and reserve space for multipart headers.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
# Parser diagnostics can contain document data; return safe application errors instead.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
